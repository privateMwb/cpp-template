# ============================================================
# .github/workflows/codeql.yml
# Static security analysis via GitHub CodeQL, on every push/PR to
# main and weekly on a schedule (catches newly-disclosed CodeQL
# query patterns even with no code changes).
# ============================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++

      # Header-only templates compile to nothing until something
      # instantiates them, so CodeQL would see "no source files" if
      # this only built the bare library target. Building examples/
      # instead — the smallest target that actually includes and uses
      # the library — gives CodeQL real instantiated code to analyze.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_REGRESSION=OFF \
            -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --target examples

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
